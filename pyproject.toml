[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jupy-notebook"
dynamic = ["version"]
description = "Jupy: a lightweight, brutalist, local Python notebook server with terminal, environments, pip manager, widgets, debugger, and exports."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Hariom Lohar", email = "hariomlohar.new@gmail.com" },
]
maintainers = [
    { name = "Hariom Lohar", email = "hariomlohar.new@gmail.com" },
]
keywords = [
    "notebook",
    "jupyter",
    "ipython",
    "data-science",
    "terminal",
    "local-notebook",
    "python-notebook",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Jupyter",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: System :: Shells",
    "Topic :: Utilities",
]

dependencies = [
    "psutil>=5.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
terminal = [
    "pywinpty>=2.0; sys_platform == 'win32'",
]
watch = [
    "watchdog>=3.0",
]
nb = [
    "nbformat>=5.9",
]
all = [
    "pywinpty>=2.0; sys_platform == 'win32'",
    "watchdog>=3.0",
    "nbformat>=5.9",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/hariomlohardev/pkg_jupy"
Repository = "https://github.com/hariomlohardev/pkg_jupy"
Issues = "https://github.com/hariomlohardev/pkg_jupy/issues"

[project.scripts]
jupy = "jupy.cli:main"

[tool.setuptools]
include-package-data = true
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
include = ["jupy*"]
exclude = ["tests*", "docs*", "build*", "dist*"]

[tool.setuptools.package-data]
jupy = [
    "static/*",
    "static/**/*",
    "static/**/*.html",
    "static/**/*.css",
    "static/**/*.js",
    "static/**/*.yml",
    "static/**/*.yaml",
    "static/**/*.json",
    "static/**/*.png",
    "static/**/*.svg",
    "static/**/*.ico",
]

[tool.setuptools.exclude-package-data]
jupy = [
    "files.md",
    "*.pyc",
    "*.pyo",
]

[tool.setuptools.dynamic]
version = { attr = "jupy.__version__" }